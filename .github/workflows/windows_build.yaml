name: Build and Release For Windows

on:
  push:
    tags:
      - "v*.*.*-windows"
  workflow_call:

jobs:
  # The updater is built first: its SHA-256 has to be stamped into QSnippet
  # build_info.py so QSnippet can verify the binary before launching it.
  build-updater:
    uses: ./.github/workflows/build_updater.yaml
    with:
      os: windows-latest
      artifact-name: updater-windows

  build-windows:
    runs-on: windows-latest
    needs: build-updater

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Load version info
        run: python tools/versioning.py
        # Sets env.APP_VERSION for later steps

      - name: Download branded updater
        uses: actions/download-artifact@v8
        with:
          name: updater-windows
          path: output/windows

      - name: Verify the updater hash
        shell: pwsh
        run: |
          # Re-hash the artifact; don't trust the value passed between jobs.
          $expected = "${{ needs.build-updater.outputs.sha256 }}"
          $actual = (Get-FileHash "output/windows/updater.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          if ($actual -ne $expected.ToLower()) {
            Write-Error "Updater hash mismatch between build and package steps"
            exit 1
          }
          "UPDATER_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows binaries (PyInstaller)
        run: tools/build.ps1
        shell: powershell
        env:
          # Stamped into config/build_info.py as UPDATER_SHA256.
          UPDATER_SHA256: ${{ env.UPDATER_SHA256 }}

      - name: Confirm the updater hash was stamped
        shell: pwsh
        run: |
          $content = Get-Content config/build_info.py -Raw
          if ($content -notmatch 'UPDATER_SHA256 = "[0-9a-f]{64}"') {
            Write-Error "build_info.py is missing a valid UPDATER_SHA256 stamp"
            Write-Host $content
            exit 1
          }
          Write-Host "build_info.py carries the updater hash"

      - name: Update Inno Setup version
        run: |
          $issContent = Get-Content "QSnippet.iss" -Raw
          $issContent = $issContent -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"'
          Set-Content "QSnippet.iss" $issContent -NoNewline
        shell: powershell

      - name: Build Windows installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.8
        with:
          path: QSnippet.iss
          options: /O+

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            output/windows/QSnippet-*-windows-installer.exe
            output/windows/QSnippet-*-windows-portable.zip
