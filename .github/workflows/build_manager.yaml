name: Build Manager

# Tag convention:
#   v*.*.*-release  →  full pipeline, stable release (must be cut from main)
#   v*.*.*-dev      →  full pipeline, Dev-channel prerelease (any branch)
#   v*.*.*-linux    →  linux standalone build only
#   v*.*.*-windows  →  windows standalone build only
#
# Dev releases are marked prerelease:true and stay invisible by default; a
# user must opt into the Dev channel in Settings to ever see them.

on:
  push:
    tags:
      - "v*.*.*-release"
      - "v*.*.*-dev"
  workflow_dispatch:

jobs:
  # Classifies the tag's channel, and for a release tag, enforces it was
  # cut from main; a dev build may come from any branch.
  guard:
    runs-on: ubuntu-latest

    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      release_name: ${{ steps.classify.outputs.release_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: reachability check needs the real commit graph.
          fetch-depth: 0

      - name: Classify tag and set channel
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"

          if [[ "$tag" == *-release ]]; then
            channel="release"
            prerelease="false"
            release_name="QSnippet $tag"
          elif [[ "$tag" == *-dev ]]; then
            channel="dev"
            prerelease="true"
            release_name="QSnippet $tag (Dev build)"
          else
            echo "::error::Unrecognised tag suffix: $tag"
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

          echo "Tag $tag classified as the $channel channel"

      - name: Require release tags to come from main
        if: steps.classify.outputs.channel == 'release'
        run: |
          set -euo pipefail

          git fetch origin main --quiet

          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "OK: $(git rev-parse --short ${{ github.sha }}) is reachable from main"
          else
            echo "::error::v*.*.*-release tags must be cut from a commit on main. " \
                 "$(git rev-parse --short ${{ github.sha }}) is not reachable from origin/main. " \
                 "Use a v*.*.*-dev tag to publish a build from another branch."
            exit 1
          fi

  # Repeats the blocking half of pr_checks.yaml. A PR cannot merge red, but a
  # tag can be cut from any commit (dev tags especially), so the release path
  # re-checks rather than trusting that a PR ever ran.
  lint:
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Lint (blocking)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

  test:
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  # Nothing is compiled until lint and the tests are green: a broken commit
  # should never reach an artifact, let alone a signed release.
  build-linux:
    needs: [lint, test]
    uses: ./.github/workflows/linux_build.yaml
    secrets: inherit

  build-windows:
    needs: [lint, test]
    uses: ./.github/workflows/windows_build.yaml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [guard, build-linux, build-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > private.asc
          gpg --batch --import private.asc
          echo "trust-model always" >> ~/.gnupg/gpg.conf
          gpg --list-secret-keys --keyid-format=long

      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.deb" \) -print0 | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Sign artifacts
        run: |
          cd dist
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --detach-sign SHA256SUMS.txt

          find . -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.deb" \) -print0 | while IFS= read -r -d '' file; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
                --detach-sign "$file"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.guard.outputs.release_name }}
          prerelease: ${{ needs.guard.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.sig
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
