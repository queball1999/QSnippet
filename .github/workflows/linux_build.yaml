name: Build and Release For Linux

on:
  push:
    tags:
      - "v*.*.*-linux"
  workflow_call:

jobs:
  # The updater is built first: its SHA-256 has to be stamped into QSnippet
  # build_info.py so QSnippet can verify the binary before launching it.
  build-updater:
    uses: ./.github/workflows/build_updater.yaml
    with:
      os: ubuntu-24.04
      artifact-name: updater-linux

  build-linux:
    runs-on: ubuntu-24.04
    needs: build-updater

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system dependencies for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-util1 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            xclip \
            xvfb

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('config/config.yaml'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download branded updater
        uses: actions/download-artifact@v8
        with:
          name: updater-linux
          path: output/linux

      - name: Verify the updater hash
        run: |
          set -e
          chmod +x output/linux/updater
          expected="${{ needs.build-updater.outputs.sha256 }}"
          actual=$(sha256sum output/linux/updater | cut -d" " -f1)
          echo "Expected: $expected"
          echo "Actual:   $actual"
          # Re-hash the artifact; don't trust the value passed between jobs.
          if [ "$actual" != "$expected" ]; then
            echo "::error::Updater hash mismatch between build and package steps"
            exit 1
          fi
          echo "UPDATER_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build Linux binary (PyInstaller)
        run: xvfb-run -a bash ./tools/build.sh
        env:
          # Stamped into config/build_info.py as UPDATER_SHA256.
          UPDATER_SHA256: ${{ env.UPDATER_SHA256 }}

      - name: Confirm the updater hash was stamped
        run: |
          if ! grep -Eq 'UPDATER_SHA256 = "[0-9a-f]{64}"' config/build_info.py; then
            echo "::error::build_info.py is missing a valid UPDATER_SHA256 stamp"
            cat config/build_info.py
            exit 1
          fi
          echo "build_info.py carries the updater hash"

      - name: Package .deb
        run: bash ./tools/package-deb.sh

      - name: Install .deb (smoke test)
        run: |
          DEB="output/linux/QSnippet_${{ steps.version.outputs.version }}_amd64.deb"
          sudo apt purge qsnippet -y || true
          cp "$DEB" /tmp/QSnippet_${{ steps.version.outputs.version }}_amd64.deb
          sudo apt install /tmp/QSnippet_${{ steps.version.outputs.version }}_amd64.deb -y

      - name: Verify installed package contents
        run: |
          set -e
          FAILED=0
          # Paths the app resolves at runtime; a missing one means a broken install
          for path in \
            /opt/QSnippet/QSnippet \
            /opt/QSnippet/config/config.yaml \
            /opt/QSnippet/assets/icons/icon_128x128.png \
            /opt/QSnippet/assets/images \
            /usr/bin/qsnippet \
            /usr/share/applications/qsnippet.desktop \
            /opt/QSnippet/updater
          do
            if [ ! -e "$path" ]; then
              echo "MISSING: $path"
              FAILED=1
            fi
          done
          # Every image declared in config.yaml must be present under assets/
          python3 - <<'EOF'
          import sys
          from pathlib import Path

          import yaml

          root = Path("/opt/QSnippet/assets")
          cfg = yaml.safe_load(open("/opt/QSnippet/config/config.yaml")) or {}
          missing = [
              f"{key} ({name})"
              for key, name in (cfg.get("images") or {}).items()
              if name and name != "QSnippet"
              and not any((root / sub / name).is_file() for sub in ("images", "icons"))
          ]
          if missing:
              sys.exit("Assets declared in config.yaml are missing from the install: " + ", ".join(missing))
          EOF
          [ "$FAILED" -eq 0 ] || exit 1
          echo "Installed package layout verified."

      - name: Package AppImage
        run: bash ./tools/package-appimage.sh

      - name: Verify AppImage contents
        run: |
          set -e
          APPIMAGE="$PWD/output/linux/QSnippet-${{ steps.version.outputs.version }}-x86_64.AppImage"
          [ -x "$APPIMAGE" ] || { echo "::error::AppImage missing or not executable: $APPIMAGE"; exit 1; }
          # Extracting runs the AppImage's own runtime, so this also proves
          # the image is well-formed, not just that the file exists.
          WORK=$(mktemp -d)
          ( cd "$WORK" && "$APPIMAGE" --appimage-extract >/dev/null )
          ROOT="$WORK/squashfs-root"
          FAILED=0
          for path in \
            AppRun \
            qsnippet.desktop \
            qsnippet.png \
            usr/lib/qsnippet/QSnippet \
            usr/lib/qsnippet/updater \
            usr/lib/qsnippet/config/config.yaml \
            usr/lib/qsnippet/config/updater.yaml \
            usr/lib/qsnippet/assets/icons/icon_128x128.png \
            usr/lib/qsnippet/assets/images \
            usr/lib/qsnippet/notices
          do
            if [ ! -e "$ROOT/$path" ]; then
              echo "MISSING: $path"
              FAILED=1
            fi
          done
          # The updater must be byte-identical to the one whose hash was stamped.
          actual=$(sha256sum "$ROOT/usr/lib/qsnippet/updater" | cut -d" " -f1)
          if [ "$actual" != "$UPDATER_SHA256" ]; then
            echo "::error::Updater inside the AppImage does not match the stamped hash"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "AppImage layout verified."

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            output/linux/QSnippet_*_amd64.deb
            output/linux/QSnippet-*.AppImage
          if-no-files-found: error
