# Default Settings Configuration
appearance:
  description: Visual appearance and layout settings.
  theme:
    type: string
    value: "system"
    default: "system"
    options:
      - "system"
      - "dark"
      - "light"
      - "nord"
      - "pink"
    description: Color theme. "System" automatically follows your OS light/dark preference.
  ui_scale:
    type: integer
    element: slider
    value: 100
    default: 100
    min: 75
    max: 150
    description: Scales all text in the application. Changes take effect immediately.
  accent_color:
    type: string
    element: colorpicker
    value: "system"
    default: "system"
    description: Accent color for selections and highlights. Click the swatch to customise.

general:
  startup_behavior:
    description: Control how the application behaves on system startup.
    start_at_boot:
      type: bool
      value: true
      default: true
      description: Launch the application automatically when the system starts.

    show_ui_at_start:
      type: bool
      value: true
      default: true
      description: Display the user interface when the application starts.

  extra_features:
    description: Optional features and fun extras that can be toggled on or off.
    easter_eggs_enabled:
      type: bool
      value: true
      default: true
      description: Enable or disable easter eggs within the application.

  table_behavior:
    description: Configure how the snippet table and folder views behave.
    expand_folders_on_load:
      type: bool
      value: false
      default: false
      description: Expand all folder views when loading the application.

    expand_on_search:
      type: bool
      value: true
      default: true
      description: Automatically expand all folder views when a search is performed.

  clipboard_behavior:
    description: Control how and when clipboard contents are cleared after copying a snippet.
    clipboard_timeout:
      type: string
      value: "30"
      default: "30"
      options:
        - "15"
        - "30"
        - "60"
        - "120"
        - "off"
      description: Clear snippet clipboard contents after the specified number of seconds.

notices:
  disable_notices:
    type: bool
    value: false
    default: false
    description: Disable all in-app notices and notifications.
  dismissed_notices:
    type: list
    value: []
    default: []
    hidden: true
    description: List of notices that have been dismissed by the user.

saving:
  navigate_home_after_save:
    type: bool
    value: true
    default: true
    description: Return to the home view after saving. If unchecked, remain on the current page.
