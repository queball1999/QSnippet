id: "notice-2026-07-03"
title: "July 3, 2026"
message: |
  Icon system enhancements and improved asset discovery in the About dialog.

  **Icon System Improvements**
    - Automatic OS-specific icon format selection. Windows uses .ico, macOS and Linux use .icns.
    - Intelligent asset loading prioritizes external assets in your project folder with graceful fallback to bundled resources.
    - Development mode now displays clear error dialogs for missing critical assets instead of silent failures.
    - Removed underscore prefixes from internal cache variables for cleaner code style.

  **About Dialog Enhancements**
    - Added scrollable content area for better display of detailed information.
    - New Asset Directories section showing exact paths to Icons and Images folders.
    - Reorganized information flow: Build Info; Environment; Application Directories; Asset Directories; Config Files; Support Information; License; Icon Attribution.
    - Title now stays fixed while content scrolls for improved navigation.

  These changes make troubleshooting asset loading issues easier and give you better visibility into your application's configuration.
