id: "v0.0.6"
title: "QSnippet 0.0.6"
message: |
  ### Linux Support
  - QSnippet now runs on Linux, verified on Debian-based distributions.
  - A `.deb` package is provided for easy installation via `apt`.
  - Linux keyboard input is handled via `evdev`.
  - Fixed clipboard integration and a missing tray icon on Linux.
  - Added autostart support on Linux.
  - Added a startup check that warns about missing system dependencies.

  ### Custom Placeholders
  - Added user-defined custom placeholders for reusable values, available in snippet autocomplete and menu insertion.
  - Open **Manage Placeholders** from **Tools -> Custom -> Manage Placeholders**, or press **F6**.
  - Example: `{work_email}` -> `name@company.com`.

  ### Organization
  - Added nested folder support for organizing snippets in multi-level paths.
  - Improved folder and tag dropdown handling for more reliable selection and editing.
  - Added support for reverting settings to their default values.

  ### Import/Export
  - Added an import/export wizard dialog for guided snippet import and export.

  ### Fixes & Reliability
  - Fixed Shiboken NoneType conversion errors that could crash the app on startup.
  - Fixed the Select All button behavior in the snippet list.
  - Resolved snippet merge conflicts.
  - Improved single application instance detection to prevent duplicate launches.
  - Improved overall UI responsiveness and performance.

  ### Packaging
  - Windows portable release is now distributed as a `.zip` archive for easier extraction.
  - Fixed version number injection into the installer script.
